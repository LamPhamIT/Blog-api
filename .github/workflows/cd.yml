name: Deploy Blog Project

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Generate .env for deploy
        run: |
          echo "# Auto-generated .env" > .env.deploy
          
          # Lặp qua tất cả secret PROD_ được GitHub inject vào runner
          for secret_name in $(compgen -v | grep '^PROD_'); do
            echo "${secret_name#PROD_}=${!secret_name}" >> .env.deploy
          done

      - name: Copy .env to VPS
        run: |
          scp -o StrictHostKeyChecking=no .env.deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/.env

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /var/www/blog
            git pull origin main
            npm install
            npm run build
            npm run migrate:prod
            pm2 restart ecosystem.config.js --env production --update-env
          "
