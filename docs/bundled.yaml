openapi: 3.0.0
info:
  title: Blog API
  version: 1.0.0
  description: API Documentation for Blog Platform
servers:
  - url: 'http://localhost:3001/api/v1'
    description: Local Development
  - url: 'http://blog-api.lamphamit.site:3000/api/v1'
    description: Production Server
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: test@example.com
                password:
                  type: string
                  example: 123456
                fullName:
                  type: string
                  example: Test User
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: user.created.success
                  message:
                    type: string
                    example: User created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: cuid123
                      email:
                        type: string
                        example: test@example.com
                      fullName:
                        type: string
                        example: Test User
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/400/content/application~1json/schema'
        '409':
          description: Email already exists
  /auth/login:
    post:
      summary: Login to the system
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  example: '123456'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: auth.login.success
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        description: JWT Access Token (RSA Signed)
                        example: eyJhbGciOiJSUzI1NiIs...
                      refreshToken:
                        type: string
                        description: JWT Refresh Token (HMAC Signed)
                        example: eyJhbGciOiJIUzI1NiIs...
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: clq12345...
                          email:
                            type: string
                            example: test@example.com
                          fullName:
                            type: string
                            example: Test User
                          roles:
                            type: array
                            items:
                              type: string
                            example:
                              - USER
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized (Token missing or invalid)
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/post/responses/401/content/application~1json/schema'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/500/content/application~1json/schema'
  /auth/me:
    get:
      summary: Get current user profile
      description: Retrieve the profile information of the currently authenticated user.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Get profile successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  message:
                    type: string
                    example: Operation successful.
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clq12345abcdef
                      email:
                        type: string
                        format: email
                        example: user@example.com
                      fullName:
                        type: string
                        nullable: true
                        example: John Doe
                      avatarUrl:
                        type: string
                        nullable: true
                        example: 'https://res.cloudinary.com/demo/image/upload/v1/avatar.jpg'
                      isActive:
                        type: boolean
                        example: true
                      roles:
                        type: array
                        items:
                          type: string
                        example:
                          - ADMIN
                          - EDITOR
                      permissions:
                        type: array
                        items:
                          type: string
                        example:
                          - POST.CREATE
                          - POST.DELETE
                      createdAt:
                        type: string
                        format: date-time
                        example: '2024-01-01T12:00:00.000Z'
                      stats:
                        type: object
                        properties:
                          postsCount:
                            type: integer
                            example: 10
                          seriesCount:
                            type: integer
                            example: 2
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/post/responses/401/content/application~1json/schema'
  /posts:
    get:
      summary: Get list of posts
      description: 'Retrieve a paginated list of posts with filtering options (search, series, tags).'
      tags:
        - Posts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by post title
        - in: query
          name: seriesId
          schema:
            type: integer
          description: Filter by Series ID
        - in: query
          name: tagSlug
          schema:
            type: string
          description: 'Filter by Tag Slug (e.g., "nodejs", "react")'
        - in: query
          name: isDraft
          schema:
            type: boolean
            default: false
          description: 'If true, returns draft posts (unpublished). Usually requires Admin role.'
      responses:
        '200':
          description: Get list successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/paths/~1posts/post/responses/201/content/application~1json/schema/properties/data'
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 10
                          total:
                            type: integer
                            example: 50
                          totalPages:
                            type: integer
                            example: 5
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 400
                  messageKey:
                    type: string
                    example: validation.failed
                  message:
                    type: string
                    example: Validation failed
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: validation.failed
                        message:
                          type: string
                          example: Invalid email format
                        field:
                          type: string
                          example: email
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  messageKey:
                    type: string
                    example: internal.server.error
                  message:
                    type: string
                    example: An unexpected error occurred on the server.
                  errors:
                    type: array
                    example: []
    post:
      summary: Create a new blog post
      description: Create a new post with auto-generated unique slug. Supports attaching series and tags (max 5 tags).
      tags:
        - Posts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  minLength: 10
                  maxLength: 200
                  description: The title of the post (will be used to generate slug).
                  example: Understanding Clean Architecture in Node.js
                contentType:
                  type: string
                  enum:
                    - QUILL_DELTA
                    - MARKDOWN
                    - HTML_RAW
                  default: QUILL_DELTA
                  description: Type of the content.
                content:
                  type: object
                  description: 'The source content (JSON Delta for Quill, or Object for others).'
                  example:
                    ops:
                      - insert: 'Hello '
                      - insert: World
                        attributes:
                          bold: true
                description:
                  type: string
                  nullable: true
                  description: Short excerpt or summary for SEO and listing cards.
                  example: A comprehensive guide to implementing Clean Architecture.
                thumbnail:
                  type: string
                  format: uri
                  nullable: true
                  description: URL of the cover image.
                  example: 'https://example.com/images/clean-arch-banner.jpg'
                seriesId:
                  type: integer
                  nullable: true
                  description: The ID of the series this post belongs to.
                  example: 1
                published:
                  type: boolean
                  default: true
                  description: Set to false to save as a draft.
                  example: true
                readTime:
                  type: integer
                  minimum: 1
                  description: Estimated read time in minutes.
                  example: 5
                tags:
                  type: array
                  description: List of tag names. Maximum 5 tags allowed.
                  maxItems: 5
                  items:
                    type: string
                  example:
                    - NodeJS
                    - Architecture
                    - Backend
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: post.created
                  message:
                    type: string
                    example: Post created successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clq12345abcdef
                      title:
                        type: string
                        example: Understanding Clean Architecture in Node.js
                      slug:
                        type: string
                        description: URL-friendly unique identifier.
                        example: understanding-clean-architecture-in-nodejs
                      excerpt:
                        type: string
                        nullable: true
                        example: A comprehensive guide to implementing Clean Architecture.
                      thumbnail:
                        type: string
                        nullable: true
                        example: 'https://example.com/images/clean-arch-banner.jpg'
                      contentType:
                        type: string
                        enum:
                          - QUILL_DELTA
                          - MARKDOWN
                          - HTML_RAW
                        example: QUILL_DELTA
                      content:
                        type: object
                        description: Source content (JSON)
                      contentHtml:
                        type: string
                        description: Rendered HTML for Web View
                        example: <p>Hello <strong>World</strong></p>
                      published:
                        type: boolean
                        example: true
                      readTime:
                        type: integer
                        example: 5
                      viewCount:
                        type: integer
                        example: 0
                      createdAt:
                        type: string
                        format: date-time
                        example: '2024-01-01T12:00:00.000Z'
                      totalUpvotes:
                        type: integer
                        example: 45
                        description: Total number of upvotes
                      isUpvoted:
                        type: boolean
                        example: true
                        description: Returns true if the current user has upvoted this post
                      author:
                        type: object
                        properties:
                          id:
                            type: string
                            example: user_12345
                          fullName:
                            type: string
                            example: John Doe
                          avatarUrl:
                            type: string
                            nullable: true
                            example: 'https://avatar.com/john.png'
                      series:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 1
                          title:
                            type: string
                            example: Backend Masterclass
                          slug:
                            type: string
                            example: backend-masterclass
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10
                            name:
                              type: string
                              example: NodeJS
                            slug:
                              type: string
                              example: nodejs
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  messageKey:
                    type: string
                    example: auth.token_missing
                  message:
                    type: string
                    example: Authentication token is missing.
                  errors:
                    type: array
                    example: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/500/content/application~1json/schema'
  '/posts/{slug}':
    get:
      summary: Get post details by slug
      description: Retrieve full details of a specific post. This action will automatically increment the view count.
      tags:
        - Posts
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The unique slug of the post
          example: huong-dan-clean-architecture-nodejs
      responses:
        '200':
          description: Get detail successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  message:
                    type: string
                    example: Operation successful.
                  data:
                    $ref: '#/paths/~1posts/post/responses/201/content/application~1json/schema/properties/data'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1comments/post/responses/404/content/application~1json/schema'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/500/content/application~1json/schema'
  '/posts/{id}/upvote':
    post:
      summary: Toggle upvote for a post
      description: Allows a logged-in user to upvote or remove upvote from a post.
      tags:
        - Posts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the post
      responses:
        '200':
          description: Toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  message:
                    type: string
                    example: Operation successful.
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                        example: clq12345abcdef
                      isUpvoted:
                        type: boolean
                        description: 'true if upvoted, false if un-upvoted'
                        example: true
                      totalUpvotes:
                        type: integer
                        example: 15
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/post/responses/401/content/application~1json/schema'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1comments/post/responses/404/content/application~1json/schema'
  /upload/image:
    post:
      summary: Upload an image file
      description: 'Upload a single image to Cloudinary. Supported formats are jpg, png, jpeg, webp. Maximum file size is 5MB.'
      tags:
        - Upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to be uploaded.
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  message:
                    type: string
                    example: Operation successful.
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: The public URL of the uploaded image.
                        example: 'https://res.cloudinary.com/your-cloud/image/upload/v17100000/blog-uploads/test-image.jpg'
                      publicId:
                        type: string
                        description: The unique identifier on Cloudinary.
                        example: blog-uploads/test-image-17100000
                      format:
                        type: string
                        example: image/jpeg
                      size:
                        type: integer
                        description: Size in bytes.
                        example: 102400
        '400':
          description: 'Validation failed (No file, wrong format, file too large)'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized (Token missing or invalid)
        '500':
          description: Internal Server Error
  /series:
    get:
      summary: Get list of series
      description: Retrieve a list of series with pagination and search.
      tags:
        - Series
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search series by title
      responses:
        '200':
          description: Fetch list successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  data:
                    type: array
                    items:
                      $ref: '#/paths/~1series/post/responses/201/content/application~1json/schema/properties/data'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 50
                      totalPages:
                        type: integer
                        example: 5
        '500':
          description: Internal Server Error
    post:
      summary: Create a new series
      description: Create a new series collection. Requires authentication.
      tags:
        - Series
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 100
                  example: Learn NestJS from Scratch
                description:
                  type: string
                  example: A complete guide to building backend applications with NestJS.
                thumbnail:
                  type: string
                  format: uri
                  example: 'https://res.cloudinary.com/demo/image/upload/nestjs-series.jpg'
      responses:
        '201':
          description: Series created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  message:
                    type: string
                    example: Operation successful.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: Learn NestJS from Scratch
                      slug:
                        type: string
                        example: learn-nestjs-from-scratch
                      description:
                        type: string
                        nullable: true
                      thumbnail:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      author:
                        type: object
                        properties:
                          id:
                            type: string
                          fullName:
                            type: string
                          avatarUrl:
                            type: string
                            nullable: true
                      _count:
                        type: object
                        properties:
                          posts:
                            type: integer
                            example: 10
                      posts:
                        type: array
                        nullable: true
                        description: List of posts belonging to this series (Only available in Get Detail API)
                        items:
                          $ref: '#/paths/~1posts/post/responses/201/content/application~1json/schema/properties/data'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
  '/series/{slug}':
    get:
      summary: Get series detail
      description: Retrieve detailed information of a series and its posts by slug.
      tags:
        - Series
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The slug of the series
          example: learn-nestjs-from-scratch
      responses:
        '200':
          description: Fetch detail successfully
          content:
            application/json:
              schema:
                $ref: '#/paths/~1series/post/responses/201/content/application~1json/schema'
        '404':
          description: Series not found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1comments/post/responses/404/content/application~1json/schema'
        '500':
          description: Internal Server Error
  /comments:
    get:
      summary: Get list of comments
      description: Retrieve a list of root comments for a specific post with nested replies.
      tags:
        - Comments
      parameters:
        - in: query
          name: postId
          required: true
          schema:
            type: string
          description: The ID of the post
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Fetch list successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  data:
                    type: array
                    items:
                      $ref: '#/paths/~1comments/post/responses/201/content/application~1json/schema/properties/data'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Validation failed (Missing postId)
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/400/content/application~1json/schema'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1posts/get/responses/500/content/application~1json/schema'
    post:
      summary: Create a new comment
      description: Create a new comment or reply (2-level nesting). Requires authentication.
      tags:
        - Comments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - postId
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Content of the comment.
                  example: This is a great article!
                postId:
                  type: string
                  format: uuid
                  description: ID of the post.
                  example: clq12345abcdef
                parentId:
                  type: string
                  nullable: true
                  format: uuid
                  description: ID of the parent comment (if replying). System automatically handles 2-level nesting.
                  example: clq98765zyxwvu
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageKey:
                    type: string
                    example: common.success
                  message:
                    type: string
                    example: Operation successful.
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clq98765zyxwvu
                      content:
                        type: string
                        example: This is a great article!
                      postId:
                        type: string
                        example: clq12345abcdef
                      parentId:
                        type: string
                        nullable: true
                        example: null
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: user_123
                          fullName:
                            type: string
                            example: Nguyen Van A
                          avatarUrl:
                            type: string
                            nullable: true
                            example: 'https://example.com/avatar.jpg'
                      children:
                        type: array
                        items:
                          $ref: '#/paths/~1comments/post/responses/201/content/application~1json/schema/properties/data'
