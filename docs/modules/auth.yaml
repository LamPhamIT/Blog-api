paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/ValidationErrorResponse"
        "409":
          description: Email already exists
  /auth/login:
    post:
      summary: Login to the system
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Unauthorized (Token missing or invalid)
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/UnauthorizedErrorResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/ValidationErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/InternalServerErrorResponse"
  /auth/me:
    get:
      summary: Get current user profile
      description: Retrieve the profile information of the currently authenticated user.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Get profile successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/UnauthorizedErrorResponse"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: test@example.com
        password:
          type: string
          example: 123456
        fullName:
          type: string
          example: Test User
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          format: password
          example: "123456"
    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: user.created.success
        message:
          type: string
          example: User created successfully
        data:
          type: object
          properties:
            id:
              type: string
              example: cuid123
            email:
              type: string
              example: test@example.com
            fullName:
              type: string
              example: Test User
    LoginResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          messageKey:
            type: string
            example: auth.login.success
          message:
            type: string
            example: Login successful
          data:
            type: object
            properties:
              accessToken:
                type: string
                description: JWT Access Token (RSA Signed)
                example: "eyJhbGciOiJSUzI1NiIs..."
              refreshToken:
                type: string
                description: JWT Refresh Token (HMAC Signed)
                example: "eyJhbGciOiJIUzI1NiIs..."
              user:
                $ref: "#/components/schemas/UserDto"

    # --- DATA OBJECTS ---
    UserDto:
      type: object
      properties:
        id:
          type: string
          example: clq12345...
        email:
          type: string
          example: test@example.com
        fullName:
          type: string
          example: Test User
        roles:
          type: array
          items:
            type: string
          example: ["USER"]
    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: common.success
        message:
          type: string
          example: Operation successful.
        data:
          $ref: "#/components/schemas/UserProfileDto"

    UserProfileDto:
      type: object
      properties:
        id:
          type: string
          example: "clq12345abcdef"
        email:
          type: string
          format: email
          example: "user@example.com"
        fullName:
          type: string
          nullable: true
          example: "John Doe"
        avatarUrl:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/demo/image/upload/v1/avatar.jpg"
        isActive:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: ["ADMIN", "EDITOR"]
        permissions:
          type: array
          items:
            type: string
          example: ["POST.CREATE", "POST.DELETE"]
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T12:00:00.000Z"
        stats:
          type: object
          properties:
            postsCount:
              type: integer
              example: 10
            seriesCount:
              type: integer
              example: 2