paths:
  /posts:
    post:
      summary: Create a new blog post
      description: Create a new post with auto-generated unique slug. Supports attaching series and tags (max 5 tags).
      tags:
        - Posts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
        "400":
          description: Validation failed or Business logic violation (e.g., Series not found, Tags limit exceeded)
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/ValidationErrorResponse"
        "401":
          description: Unauthorized - Access token is missing or invalid
        "500":
          description: Internal Server Error

components:
  schemas:
    # --- REQUEST BODY ---
    CreatePostRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 200
          description: The title of the post (will be used to generate slug).
          example: "Understanding Clean Architecture in Node.js"
        content:
          type: string
          minLength: 50
          description: The main content of the post (HTML or Markdown).
          example: "Clean Architecture is a software design philosophy..."
        description:
          type: string
          nullable: true
          description: Short excerpt or summary for SEO and listing cards.
          example: "A comprehensive guide to implementing Clean Architecture."
        thumbnail:
          type: string
          format: uri
          nullable: true
          description: URL of the cover image.
          example: "https://example.com/images/clean-arch-banner.jpg"
        seriesId:
          type: integer
          nullable: true
          description: The ID of the series this post belongs to.
          example: 1
        published:
          type: boolean
          default: true
          description: Set to false to save as a draft.
          example: true
        readTime:
          type: integer
          minimum: 1
          description: Estimated read time in minutes.
          example: 5
        tags:
          type: array
          description: List of tag names. Maximum 5 tags allowed.
          maxItems: 5
          items:
            type: string
          example: ["NodeJS", "Architecture", "Backend"]

    # --- RESPONSE WRAPPER ---
    PostResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: post.created
        message:
          type: string
          example: Post created successfully.
        data:
          $ref: "#/components/schemas/PostDto"

    # --- DATA OBJECTS ---
    PostDto:
      type: object
      properties:
        id:
          type: string
          example: clq12345abcdef
        title:
          type: string
          example: "Understanding Clean Architecture in Node.js"
        slug:
          type: string
          description: URL-friendly unique identifier.
          example: "understanding-clean-architecture-in-nodejs"
        excerpt:
          type: string
          nullable: true
          example: "A comprehensive guide to implementing Clean Architecture."
        thumbnail:
          type: string
          nullable: true
          example: "https://example.com/images/clean-arch-banner.jpg"
        content:
          type: string
          description: Full content is usually not returned in list view, but returned in create/detail.
        published:
          type: boolean
          example: true
        readTime:
          type: integer
          example: 5
        viewCount:
          type: integer
          example: 0
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T12:00:00.000Z"
        
        # Relations
        author:
          $ref: "#/components/schemas/AuthorDto"
        series:
          $ref: "#/components/schemas/SeriesDto"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagDto"

    # --- SUB-SCHEMAS ---
    AuthorDto:
      type: object
      properties:
        id:
          type: string
          example: user_12345
        fullName:
          type: string
          example: "John Doe"
        avatarUrl:
          type: string
          nullable: true
          example: "https://avatar.com/john.png"

    SeriesDto:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Backend Masterclass"
        slug:
          type: string
          example: "backend-masterclass"

    TagDto:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "NodeJS"
        slug:
          type: string
          example: "nodejs"