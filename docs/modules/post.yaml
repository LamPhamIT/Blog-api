paths:
  /posts:
    get:
      summary: Get list of posts
      description: Retrieve a paginated list of posts with filtering options (search, series, tags).
      tags:
        - Posts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by post title
        - in: query
          name: seriesId
          schema:
            type: integer
          description: Filter by Series ID
        - in: query
          name: tagSlug
          schema:
            type: string
          description: Filter by Tag Slug (e.g., "nodejs", "react")
        - in: query
          name: isDraft
          schema:
            type: boolean
            default: false
          description: If true, returns draft posts (unpublished). Usually requires Admin role.
      responses:
        "200":
          description: Get list successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/ValidationErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/InternalServerErrorResponse"
    post:
      summary: Create a new blog post
      description: Create a new post with auto-generated unique slug. Supports attaching series and tags (max 5 tags).
      tags:
        - Posts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePostResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/UnauthorizedErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/InternalServerErrorResponse"
  /posts/{slug}:
    get:
      summary: Get post details by slug
      description: Retrieve full details of a specific post. This action will automatically increment the view count.
      tags:
        - Posts
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The unique slug of the post
          example: "huong-dan-clean-architecture-nodejs"
      responses:
        "200":
          description: Get detail successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/NotFoundErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/InternalServerErrorResponse"
  /posts/{id}/upvote:
    post:
      summary: Toggle upvote for a post
      description: Allows a logged-in user to upvote or remove upvote from a post.
      tags:
        - Posts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the post
      responses:
        "200":
          description: Toggled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpvoteResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/UnauthorizedErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/NotFoundErrorResponse"
components:
  schemas:
    # --- REQUEST BODY ---
    CreatePostRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 200
          description: The title of the post (will be used to generate slug).
          example: "Understanding Clean Architecture in Node.js"
        content:
          type: string
          minLength: 50
          description: The main content of the post (HTML or Markdown).
          example: "Clean Architecture is a software design philosophy..."
        description:
          type: string
          nullable: true
          description: Short excerpt or summary for SEO and listing cards.
          example: "A comprehensive guide to implementing Clean Architecture."
        thumbnail:
          type: string
          format: uri
          nullable: true
          description: URL of the cover image.
          example: "https://example.com/images/clean-arch-banner.jpg"
        seriesId:
          type: integer
          nullable: true
          description: The ID of the series this post belongs to.
          example: 1
        published:
          type: boolean
          default: true
          description: Set to false to save as a draft.
          example: true
        readTime:
          type: integer
          minimum: 1
          description: Estimated read time in minutes.
          example: 5
        tags:
          type: array
          description: List of tag names. Maximum 5 tags allowed.
          maxItems: 5
          items:
            type: string
          example: ["NodeJS", "Architecture", "Backend"]

    # --- RESPONSE WRAPPER ---
    CreatePostResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: post.created
        message:
          type: string
          example: Post created successfully.
        data:
          $ref: "#/components/schemas/PostDto"
    
    PostDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: common.success
        message:
          type: string
          example: Operation successful.
        data:
          $ref: "#/components/schemas/PostDto"

    # --- DATA OBJECTS ---
    PostDto:
      type: object
      properties:
        id:
          type: string
          example: clq12345abcdef
        title:
          type: string
          example: "Understanding Clean Architecture in Node.js"
        slug:
          type: string
          description: URL-friendly unique identifier.
          example: "understanding-clean-architecture-in-nodejs"
        excerpt:
          type: string
          nullable: true
          example: "A comprehensive guide to implementing Clean Architecture."
        thumbnail:
          type: string
          nullable: true
          example: "https://example.com/images/clean-arch-banner.jpg"
        content:
          type: string
          description: Full content is usually not returned in list view, but returned in create/detail.
        published:
          type: boolean
          example: true
        readTime:
          type: integer
          example: 5
        viewCount:
          type: integer
          example: 0
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T12:00:00.000Z"
        totalUpvotes:
          type: integer
          example: 45
          description: Total number of upvotes
        isUpvoted:
          type: boolean
          example: true
          description: Returns true if the current user has upvoted this post
        
        # Relations
        author:
          $ref: "#/components/schemas/AuthorDto"
        series:
          $ref: "#/components/schemas/SeriesDto"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagDto"

    # --- SUB-SCHEMAS ---
    AuthorDto:
      type: object
      properties:
        id:
          type: string
          example: user_12345
        fullName:
          type: string
          example: "John Doe"
        avatarUrl:
          type: string
          nullable: true
          example: "https://avatar.com/john.png"

    SeriesDto:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Backend Masterclass"
        slug:
          type: string
          example: "backend-masterclass"

    TagDto:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "NodeJS"
        slug:
          type: string
          example: "nodejs"

    PostListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: common.success
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PostDto"
            meta:
              $ref: "#/components/schemas/PaginationMeta"

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 5
    UpvoteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: common.success
        message:
          type: string
          example: Operation successful.
        data:
          type: object
          properties:
            postId:
              type: string
              example: "clq12345abcdef"
            isUpvoted:
              type: boolean
              description: true if upvoted, false if un-upvoted
              example: true
            totalUpvotes:
              type: integer
              example: 15