paths:
  /comments:
    post:
      summary: Create a new comment
      description: Create a new comment or reply (2-level nesting). Requires authentication.
      tags:
        - Comments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          description: Validation failed (Parent not found, Parent belongs to other post...)
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/ValidationErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/NotFoundErrorResponse"
        "500":
          description: Internal Server Error

components:
  schemas:
    # --- REQUEST BODY ---
    CreateCommentRequest:
      type: object
      required:
        - content
        - postId
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          description: Content of the comment.
          example: "This is a great article!"
        postId:
          type: string
          format: uuid
          description: ID of the post.
          example: "clq12345abcdef"
        parentId:
          type: string
          nullable: true
          format: uuid
          description: ID of the parent comment (if replying). System automatically handles 2-level nesting.
          example: "clq98765zyxwvu"

    # --- RESPONSE WRAPPER ---
    CommentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: common.success
        message:
          type: string
          example: Operation successful.
        data:
          $ref: "#/components/schemas/CommentDto"

    # --- DATA OBJECT ---
    CommentDto:
      type: object
      properties:
        id:
          type: string
          example: "clq98765zyxwvu"
        content:
          type: string
          example: "This is a great article!"
        postId:
          type: string
          example: "clq12345abcdef"
        parentId:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: string
              example: "user_123"
            fullName:
              type: string
              example: "Nguyen Van A"
            avatarUrl:
              type: string
              nullable: true
              example: "https://example.com/avatar.jpg"