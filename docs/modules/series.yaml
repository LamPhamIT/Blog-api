paths:
  /series:
    get:
      summary: Get list of series
      description: Retrieve a list of series with pagination and search.
      tags:
        - Series
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search series by title
      responses:
        "200":
          description: Fetch list successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesListResponse"
        "500":
          description: Internal Server Error

    post:
      summary: Create a new series
      description: Create a new series collection. Requires authentication.
      tags:
        - Series
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeriesRequest"
      responses:
        "201":
          description: Series created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/ValidationErrorResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /series/{slug}:
    get:
      summary: Get series detail
      description: Retrieve detailed information of a series and its posts by slug.
      tags:
        - Series
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The slug of the series
          example: "learn-nestjs-from-scratch"
      responses:
        "200":
          description: Fetch detail successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesResponse"
        "404":
          description: Series not found
          content:
            application/json:
              schema:
                $ref: "../common/error.yaml#/NotFoundErrorResponse"
        "500":
          description: Internal Server Error

  /series/{id}:
    patch:
      summary: Update a series
      description: Update series information. Only the author can update.
      tags:
        - Series
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeriesRequest"
      responses:
        "200":
          description: Update successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Series not found
        "500":
          description: Internal Server Error

    delete:
      summary: Delete a series
      description: Delete a series. Only the author can delete.
      tags:
        - Series
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the series
      responses:
        "200":
          description: Delete successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Series not found
        "500":
          description: Internal Server Error

  /series/{id}/posts:
    patch:
      summary: Add posts to series
      description: Add existing posts to a series. Posts will be automatically ordered at the end of the list.
      tags:
        - Series
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPostsToSeriesRequest"
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Series not found

    delete:
      summary: Remove posts from series
      description: Remove posts from a series.
      tags:
        - Series
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemovePostsFromSeriesRequest"
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Series not found

components:
  schemas:
    CreateSeriesRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 100
          example: "Learn NestJS from Scratch"
        description:
          type: string
          example: "A complete guide to building backend applications with NestJS."
        thumbnail:
          type: string
          format: uri
          example: "https://res.cloudinary.com/demo/image/upload/nestjs-series.jpg"
        postIds:
          type: array
          items:
            type: string
            format: uuid
          description: List of post IDs to add to the series immediately.
          example: ["clq12345abcdef", "clq67890ghijk"]

    UpdateSeriesRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
        thumbnail:
          type: string
          format: uri

    AddPostsToSeriesRequest:
      type: object
      required:
        - postIds
      properties:
        postIds:
          type: array
          items:
            type: string
            format: uuid
          example: ["clq12345abcdef", "clq67890ghijk"]

    RemovePostsFromSeriesRequest:
      type: object
      required:
        - postIds
      properties:
        postIds:
          type: array
          items:
            type: string
            format: uuid
          example: ["clq12345abcdef"]

    SeriesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: common.success
        message:
          type: string
          example: Operation successful.
        data:
          $ref: "#/components/schemas/SeriesDto"

    SeriesListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        messageKey:
          type: string
          example: common.success
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDto"
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 50
            totalPages:
              type: integer
              example: 5

    SeriesDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Learn NestJS from Scratch"
        slug:
          type: string
          example: "learn-nestjs-from-scratch"
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          type: object
          properties:
            id:
              type: string
            fullName:
              type: string
            avatarUrl:
              type: string
              nullable: true
        _count:
          type: object
          properties:
            posts:
              type: integer
              example: 10
        posts:
          type: array
          nullable: true
          description: List of posts belonging to this series (Only available in Get Detail API)
          items:
             $ref: "../modules/post.yaml#/components/schemas/PostDto"