ValidationErrorDetail:
  type: object
  properties:
    code:
      type: string
      example: "validation.failed"
    message:
      type: string
      example: "Invalid email format"
    field:
      type: string
      example: "email"

ValidationErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    statusCode:
      type: integer
      example: 400
    messageKey:
      type: string
      example: "validation.failed"
    message:
      type: string
      example: "Validation failed"
    details:
      type: array
      items:
        $ref: "#/ValidationErrorDetail"
UnauthorizedErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    messageKey:
      type: string
      example: auth.token_missing
    message:
      type: string
      example: Authentication token is missing.
    errors:
      type: array
      example: []
NotFoundErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    messageKey:
      type: string
      example: not.found
    message:
      type: string
      example: The requested resource was not found.
    errors:
      type: array
      example: []
InternalServerErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    messageKey:
      type: string
      example:  internal.server.error
    message:
      type: string
      example: An unexpected error occurred on the server.
    errors:
      type: array
      example: []
ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    statusCode:
      type: integer
      example: 409
    messageKey:
      type: string
      example: "user.email.exists"
    message:
      type: string
      example: "The provided email is already in use."
    details:
      type: array
      items: 
        type: object
      example: []